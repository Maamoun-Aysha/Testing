<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elias & Noor | Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ==============================
   BASE
============================== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --gold:#ffd98a;
  --deep:#160807;
  --brown:#6d351c;
  --cream:#fff4df;
  --glass:rgba(42,18,10,.36);
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Montserrat, sans-serif;
  overflow-x:hidden;
  color:white;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,217,138,.25), transparent 34%),
    radial-gradient(circle at 85% 75%, rgba(255,116,65,.22), transparent 38%),
    linear-gradient(145deg,#2b110a,#080201 70%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(circle at 50% -10%, rgba(255,238,184,.22), transparent 42%),
    linear-gradient(to bottom, rgba(255,255,255,.04), transparent 35%);
  animation:ambientGlow 9s ease-in-out infinite alternate;
}

@keyframes ambientGlow{
  from{transform:translateY(0); opacity:.8}
  to{transform:translateY(70px); opacity:1}
}

button,a{
  -webkit-tap-highlight-color:transparent;
}

/* ==============================
   INTRO CARD
============================== */
.intro{
  position:fixed;
  inset:0;
  height:100dvh;
  min-height:100svh;
  display:grid;
  place-items:center;
  z-index:9999;
  overflow:hidden;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.65)),
    url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1800&q=80") center/cover;
  transition:opacity 1s ease, transform 1s ease;
}

.intro.hide{
  opacity:0;
  transform:scale(1.05);
  pointer-events:none;
}

.intro-card{
  width:min(88%,430px);
  min-height:560px;
  border-radius:36px;
  padding:34px 24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(to bottom, rgba(35,14,8,.28), rgba(15,5,4,.78)),
    url("https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=1200&q=80") center/cover;
  border:1px solid rgba(255,217,138,.42);
  box-shadow:
    0 0 80px rgba(255,155,75,.38),
    inset 0 0 60px rgba(255,217,138,.08);
  animation:introFloat 3s ease-in-out infinite;
}

@keyframes introFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.intro-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 15%, rgba(255,217,138,.26), transparent 36%),
    linear-gradient(to bottom, transparent, rgba(0,0,0,.34));
  pointer-events:none;
}

.intro-small{
  position:relative;
  z-index:2;
  color:var(--gold);
  letter-spacing:4px;
  font-size:12px;
  text-transform:uppercase;
  font-weight:600;
}

.intro-names{
  position:relative;
  z-index:2;
  font-family:'Great Vibes', cursive;
  font-size:82px;
  line-height:.92;
  margin-top:22px;
  text-shadow:0 0 35px rgba(255,160,80,.65), 0 4px 18px rgba(0,0,0,.9);
}

.intro-date{
  position:relative;
  z-index:2;
  margin-top:22px;
  font-family:'Playfair Display', serif;
  color:#fff2cc;
  font-size:22px;
}

.open-btn{
  position:relative;
  z-index:2;
  margin-top:34px;
  border:none;
  padding:15px 26px;
  border-radius:999px;
  background:linear-gradient(135deg,#fff2bd,#d99b32,#7a3d18);
  color:#1a0804;
  font-family:Montserrat, sans-serif;
  font-weight:700;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 0 28px rgba(255,217,138,.55);
  animation:pulseBtn 1.7s ease-in-out infinite;
}

@keyframes pulseBtn{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.045)}
}

/* ==============================
   CONTROLS
============================== */
.website{
  display:none;
  position:relative;
  z-index:2;
}

.control{
  position:fixed;
  z-index:9997;
  border:none;
  padding:10px 14px;
  border-radius:999px;
  font-family:Montserrat, sans-serif;
  font-size:13px;
  font-weight:700;
  color:#1b0905;
  background:linear-gradient(135deg,#fff2bd,#d99b32);
  box-shadow:0 8px 24px rgba(0,0,0,.3), 0 0 18px rgba(255,217,138,.35);
  cursor:pointer;
}

.lang-toggle{
  top:calc(14px + env(safe-area-inset-top));
  right:14px;
}

.music-toggle{
  bottom:calc(14px + env(safe-area-inset-bottom));
  left:14px;
}

.music-toggle.muted{
  background:rgba(255,255,255,.14);
  color:white;
  border:1px solid rgba(255,217,138,.35);
}

.scroll-hint{
  position:fixed;
  left:50%;
  bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:9997;
  display:none;
  flex-direction:column;
  align-items:center;
  color:var(--gold);
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  pointer-events:none;
  text-shadow:0 0 12px rgba(255,217,138,.95);
}

.scroll-hint.show{
  display:flex;
  animation:hintFade 4s ease forwards;
}

.scroll-arrow{
  font-size:28px;
  animation:bounce 1.1s ease-in-out infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0); opacity:.65}
  50%{transform:translateY(8px); opacity:1}
}

@keyframes hintFade{
  0%,100%{opacity:0}
  15%,80%{opacity:1}
}

/* ==============================
   LAYOUT
============================== */
.container{
  max-width:820px;
  margin:auto;
  padding:24px 14px 70px;
}

.hero{
  min-height:96svh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.hero-card{
  width:100%;
  min-height:82svh;
  border-radius:34px;
  padding:34px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(to bottom, rgba(35,14,8,.12), rgba(18,7,5,.62)),
    radial-gradient(circle at 50% 30%, rgba(255,217,138,.18), transparent 46%),
    url("https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1600&q=80") center/cover;
  border:1px solid rgba(255,217,138,.34);
  box-shadow:0 0 70px rgba(255,143,72,.24), inset 0 0 60px rgba(255,217,138,.08);
}

.hero-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.68), transparent 52%);
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:3;
}

.kicker{
  color:var(--gold);
  letter-spacing:4px;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
}

.names{
  margin-top:20px;
  font-family:'Great Vibes', cursive;
  font-size:90px;
  line-height:.9;
  text-shadow:0 0 30px rgba(255,160,80,.58), 0 3px 20px rgba(0,0,0,.85);
}

.and{
  color:var(--gold);
  font-family:'Playfair Display', serif;
  font-size:30px;
  margin:8px 0;
}

.date{
  margin-top:22px;
  font-family:'Playfair Display', serif;
  font-size:30px;
  color:var(--gold);
}

.info{
  margin-top:14px;
  line-height:1.8;
  color:#fff5df;
  text-shadow:0 2px 10px rgba(0,0,0,.9);
}

.countdown{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:28px;
}

.time-box{
  padding:12px 4px;
  border-radius:16px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,217,138,.28);
  backdrop-filter:blur(5px);
}

.time-box span{
  display:block;
  color:var(--gold);
  font-size:23px;
  font-weight:700;
}

.time-box small{
  font-size:10px;
  opacity:.95;
}

/* ==============================
   SECTIONS
============================== */
.lux-section{
  min-height:88svh;
  margin:22px 0;
  padding:34px 0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  isolation:isolate;
  border-radius:34px;
  background-size:cover;
  background-position:center;
  border:1px solid rgba(255,217,138,.26);
  box-shadow:0 0 45px rgba(255,143,72,.2), inset 0 0 60px rgba(255,217,138,.07);
}

.lux-section::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  background:
    linear-gradient(to bottom, rgba(16,5,3,.18), rgba(10,3,2,.68)),
    radial-gradient(circle at center, rgba(255,217,138,.13), transparent 58%);
}

.section-story{background-image:url("https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1600&q=80")}
.section-venue{background-image:url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80")}
.section-dress{background-image:url("https://images.unsplash.com/photo-1469371670807-013ccf25f16a?auto=format&fit=crop&w=1600&q=80")}
.section-gallery{background-image:url("https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1600&q=80")}
.section-rsvp{background-image:url("https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=1600&q=80")}
.section-final{background-image:url("https://images.unsplash.com/photo-1504196606672-aef5c9cefc92?auto=format&fit=crop&w=1600&q=80")}

.lux-box{
  width:88%;
  min-height:54svh;
  padding:28px 20px;
  border-radius:30px;
  position:relative;
  z-index:3;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:var(--glass);
  backdrop-filter:blur(6px);
  border:1px solid rgba(255,217,138,.38);
  box-shadow:0 0 42px rgba(255,143,72,.2);
  opacity:0;
  transform:translateY(36px) scale(.98);
  transition:.9s ease;
}

.lux-box.show,
.hero-card.show{
  opacity:1;
  transform:translateY(0) scale(1);
}

.hero-card{
  opacity:0;
  transform:translateY(34px) scale(.98);
  transition:.9s ease;
}

.lux-box h2{
  font-family:'Great Vibes', cursive;
  font-size:62px;
  line-height:.95;
  color:var(--gold);
  text-shadow:0 0 22px rgba(255,130,70,.65), 0 2px 12px rgba(0,0,0,.9);
}

.lux-box p{
  margin-top:16px;
  line-height:1.85;
  color:#fff4df;
  text-shadow:0 2px 10px rgba(0,0,0,.88);
}

.detail-list{
  margin-top:22px;
  display:grid;
  gap:10px;
}

.detail-pill{
  padding:12px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,217,138,.25);
  color:#fff5df;
}

/* ==============================
   POLAROIDS
============================== */
.polaroid{
  position:absolute;
  width:126px;
  padding:8px;
  border-radius:12px;
  background:white;
  color:#1b0905;
  box-shadow:0 24px 55px rgba(0,0,0,.7);
  z-index:4;
  opacity:0;
  transition:1s ease;
}

.polaroid img{
  width:100%;
  height:120px;
  display:block;
  object-fit:cover;
  border-radius:6px;
}

.polaroid span{
  display:block;
  text-align:center;
  margin-top:7px;
  font-family:'Great Vibes', cursive;
  font-size:23px;
}

.polaroid.left{
  left:-36px;
  top:10%;
  transform:translateX(-100px) rotate(-12deg);
}

.polaroid.right{
  right:-36px;
  bottom:10%;
  transform:translateX(100px) rotate(12deg);
}

.polaroid.show{
  opacity:1;
  transform:translateX(0) rotate(var(--r));
}

/* ==============================
   BUTTONS
============================== */
.rsvp-buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:24px;
}

.btn{
  display:block;
  border:none;
  width:100%;
  text-decoration:none;
  text-align:center;
  padding:15px 16px;
  border-radius:999px;
  font-family:Montserrat, sans-serif;
  font-weight:700;
  cursor:pointer;
  transition:.25s ease;
}

.btn:hover{transform:scale(1.04)}

.btn.gold{
  background:linear-gradient(135deg,#fff2bd,#d99b32,#7a3d18);
  color:#180704;
  box-shadow:0 0 24px rgba(255,217,138,.4);
}

.btn.glass{
  background:rgba(255,255,255,.12);
  color:white;
  border:1px solid rgba(255,217,138,.34);
}

/* ==============================
   MODALS
============================== */
.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9998;
  padding:20px;
  background:rgba(15,5,3,.76);
  backdrop-filter:blur(10px);
}

.modal-box{
  width:min(92%,390px);
  border-radius:30px;
  padding:32px 22px 26px;
  text-align:center;
  position:relative;
  background:linear-gradient(145deg, rgba(42,18,10,.88), rgba(120,55,25,.76));
  border:1px solid rgba(255,217,138,.42);
  box-shadow:
